{{ $g := site.Params.giscus }}
{{ if and $g.repo (eq .Section "blog") .IsPage (ne .Params.comments false) }}
  <section id="comments" aria-label="Comments" class="mt-8 pt-8 border-t border-gray-200 dark:border-gray-700"
           data-giscus-repo="{{ $g.repo }}"
           data-giscus-repo-id="{{ $g.repo_id }}"
           data-giscus-category="{{ $g.category }}"
           data-giscus-category-id="{{ $g.category_id }}"
           data-giscus-mapping="{{ $g.mapping }}"
           data-giscus-strict="{{ if $g.strict }}1{{ else }}0{{ end }}"
           data-giscus-reactions-enabled="{{ if $g.reactions_enabled }}1{{ else }}0{{ end }}"
           data-giscus-emit-metadata="{{ if $g.emit_metadata }}1{{ else }}0{{ end }}"
           data-giscus-input-position="{{ $g.input_position }}"
           data-giscus-lang="{{ $g.lang }}"></section>
{{ end }}
