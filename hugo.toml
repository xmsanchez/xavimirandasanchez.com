baseURL = "https://xavimirandasanchez.com/"
locale = "en-us"
title = "Xavi Miranda Sánchez | Platform Engineer"

# Build settings
buildDrafts = false
buildFuture = false
enableRobotsTXT = true
enableGitInfo = false

# Tags are shown as badges only; no taxonomy/term pages are generated
disableKinds = ["taxonomy", "term"]

[markup.highlight]
  style = "github-dark"

[pagination]
  pagerSize = 12

# Parameters (site-wide variables)
[params]
  # Author info
  author = "Xavi Miranda Sánchez"
  bio = "I've worked as SysOps, SRE and DevOps Engineer. I'm specialized in Cloud Computing and Kubernetes, using tools like Terraform for infrastructure provisioning and python for automation."
  location = "Barcelona, Spain"
  
  # Social links
  [params.social]
    github = "https://github.com/xmsanchez"
    linkedin = "https://www.linkedin.com/in/xavi-miranda-s%C3%A1nchez/"
    email = "mailto:xms.pixel@gmail.com"
  
  # Giscus configuration
  [params.giscus]
    repo = "xmsanchez/xavimirandasanchez.com"
    repo_id = "R_kgDOQuNPaw"
    category = "General"
    category_id = "DIC_kwDOQuNPa84C0MjB"
    mapping = "pathname"
    strict = false
    reactions_enabled = true
    emit_metadata = false
    input_position = "bottom"
    theme = "preferred_color_scheme"
    lang = "en"
  
  # Homepage settings
  [params.homepage]
    recent_posts_count = 5
  
  # Theme settings
  [params.theme]
    dark_mode_default = false
    show_dark_mode_toggle = true

# Menu (navigation)
[[menu.main]]
  identifier = "home"
  name = "Home"
  url = "/"
  weight = 10

[[menu.main]]
  identifier = "blog"
  name = "Blog"
  url = "/blog/"
  weight = 20

[[menu.main]]
  identifier = "projects"
  name = "Projects"
  url = "/projects/"
  weight = 30

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 40

# Output formats
[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

