{{ with site.Params.social }}
  <div class="flex items-center space-x-4">
    {{ range $name, $label := dict "github" "GitHub" "linkedin" "LinkedIn" "twitter" "Twitter" "email" "Email" }}
      {{ with index $.Site.Params.social $name }}
        <a href="{{ . }}" aria-label="{{ $label }}" {{ if ne $name "email" }}target="_blank" rel="noopener noreferrer"{{ end }}
           class="text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-100 transition-colors">
          {{ partial "icon.html" (dict "name" $name) }}
        </a>
      {{ end }}
    {{ end }}
  </div>
{{ end }}
