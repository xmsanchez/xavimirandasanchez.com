<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" class="scroll-smooth">
  {{ partial "head.html" . }}
  <body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-200">
    <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:z-50 focus:m-2 focus:px-4 focus:py-2 focus:bg-blue-600 focus:text-white focus:rounded">Skip to content</a>
    {{ partial "header.html" . }}
    <main id="main" class="min-h-screen">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    <script src="{{ "js/site.js" | relURL }}"></script>
  </body>
</html>
